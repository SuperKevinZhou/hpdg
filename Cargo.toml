[package]
name = "hpdg"
version = "0.1.0"
edition = "2024"
description = "Rust-first data generator for competitive programming and OI workflows."
license = "MIT"
readme = "README.md"
repository = "https://github.com/SuperKevinZhou/hpdg"
documentation = "https://docs.rs/hpdg"
keywords = ["oi", "generator", "testdata", "graph", "cyaron"]
categories = ["algorithms", "development-tools::testing"]
exclude = [
  ".github/**",
  ".gitignore",
  "notes.txt",
  "python/**"
]

[dependencies]
thiserror = "1.0.69"
rand = "0.9.2"
getrandom = { version = "0.2", features = ["js"] }
pyo3 = { version = "0.21", optional = true, features = ["extension-module", "abi3-py38"] }

[features]
default = ["proc", "parallel", "io", "testcase", "graph", "math", "sequence", "vector", "string", "polygon", "query", "compare", "utils", "core", "rng", "traits", "error"]
proc = []
parallel = []
io = []
testcase = []
graph = []
math = []
sequence = []
vector = []
string = []
polygon = []
query = []
compare = []
utils = []
core = []
rng = []
traits = []
error = []
python-bindings = ["pyo3"]
c-bindings = []

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "basic"
harness = false
